<!doctype html>
<html lang="en" class="dark h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart Litter Detection — Login</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%91%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 400: '#8b7ff0', 500: '#6c5ce7', 600: '#5b4bc4' },
            dark: { 900: '#0f1216', 800: '#161822', 700: '#1e2030', 600: '#2a313c' },
          },
        },
      },
    };
  </script>
</head>
<body class="h-full bg-dark-900 text-slate-100 antialiased flex items-center justify-center p-4 font-sans">
  <form id="loginForm" class="bg-dark-800 border border-dark-600 rounded-2xl p-8 w-full max-w-sm flex flex-col gap-4 shadow-2xl">
    <div class="flex items-center gap-3 mb-2">
      <span class="relative flex h-2.5 w-2.5">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
      </span>
      <span class="font-bold text-lg text-slate-100 tracking-tight">Smart Litter</span>
    </div>

    <div>
      <label for="username" class="block text-xs font-medium text-slate-400 mb-1.5">Username</label>
      <input id="username" name="username" autocomplete="username" required class="w-full bg-dark-900 border border-dark-600 text-slate-100 rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:border-brand-500 transition placeholder:text-slate-600" />
    </div>

    <div>
      <label for="password" class="block text-xs font-medium text-slate-400 mb-1.5">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required class="w-full bg-dark-900 border border-dark-600 text-slate-100 rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:border-brand-500 transition placeholder:text-slate-600" />
    </div>

    <div class="text-xs text-rose-400 min-h-[16px] font-medium" id="error" role="alert"></div>

    <button type="submit" id="submitBtn" class="w-full bg-brand-500 hover:bg-brand-600 active:bg-brand-600 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold text-sm py-2.5 rounded-lg transition shadow-lg shadow-brand-500/20 flex items-center justify-center gap-2">
      <svg id="spinner" class="hidden animate-spin h-4 w-4" viewBox="0 0 24 24" fill="none">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
      </svg>
      <span id="submitLabel">Sign in</span>
    </button>
  </form>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function (ev) {
      ev.preventDefault();
      const errEl = document.getElementById('error');
      const btn = document.getElementById('submitBtn');
      const spinner = document.getElementById('spinner');
      const label = document.getElementById('submitLabel');
      errEl.textContent = '';
      btn.disabled = true;
      spinner.classList.remove('hidden');
      label.textContent = 'Signing in…';

      const body = new URLSearchParams();
      body.set('username', document.getElementById('username').value);
      body.set('password', document.getElementById('password').value);

      try {
        const resp = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: body,
        });
        if (!resp.ok) {
          errEl.textContent = 'Incorrect username or password';
          btn.disabled = false;
          spinner.classList.add('hidden');
          label.textContent = 'Sign in';
          return;
        }
        const data = await resp.json();
        localStorage.setItem('access_token', data.access_token);
        localStorage.setItem('refresh_token', data.refresh_token);
        window.location.href = '/';
      } catch (e) {
        errEl.textContent = 'Login failed: ' + e;
        btn.disabled = false;
        spinner.classList.add('hidden');
        label.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart Litter Detection — Login</title>
  <style>
    :root { --bg:#0f1216; --card:#1a1f27; --line:#2a313c; --txt:#e7ecf3; --muted:#8b95a5; --accent:#6c5ce7; --err:#e74c3c; }
    * { box-sizing: border-box; margin:0; padding:0; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background:var(--bg); color:var(--txt); min-height:100vh;
           display:flex; align-items:center; justify-content:center; }
    form { background:var(--card); border:1px solid var(--line); border-radius:12px;
           padding:32px; width:320px; display:flex; flex-direction:column; gap:14px; }
    .brand { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
    .brand .dot { width:10px; height:10px; border-radius:50%; background:#2ecc71; }
    .brand span { font-size:16px; font-weight:600; }
    label { font-size:13px; color:var(--muted); }
    input { background:#1e2030; color:var(--txt); border:1px solid var(--line);
            padding:10px 12px; border-radius:8px; font-size:14px; }
    input:focus { outline:none; border-color:var(--accent); }
    button { background:var(--accent); color:#fff; border:none; font-weight:600;
             font-size:14px; padding:11px; border-radius:8px; cursor:pointer; margin-top:6px; }
    button:hover { opacity:.9; }
    button:disabled { opacity:.6; cursor:default; }
    .error { color:var(--err); font-size:13px; min-height:16px; }
  </style>
</head>
<body>
  <form id="loginForm">
    <div class="brand"><span class="dot"></span><span>Smart Litter</span></div>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <div class="error" id="error"></div>
    <button type="submit" id="submitBtn">Sign in</button>
  </form>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function (ev) {
      ev.preventDefault();
      const errEl = document.getElementById('error');
      const btn = document.getElementById('submitBtn');
      errEl.textContent = '';
      btn.disabled = true;

      const body = new URLSearchParams();
      body.set('username', document.getElementById('username').value);
      body.set('password', document.getElementById('password').value);

      try {
        const resp = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: body,
        });
        if (!resp.ok) {
          errEl.textContent = 'Incorrect username or password';
          btn.disabled = false;
          return;
        }
        const data = await resp.json();
        localStorage.setItem('access_token', data.access_token);
        window.location.href = '/';
      } catch (e) {
        errEl.textContent = 'Login failed: ' + e;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Smart Litter Detection — Dashboard</title>
		<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%91%EF%B8%8F%3C/text%3E%3C/svg%3E" />
		<script src="https://cdn.tailwindcss.com"></script>
		<script>
			tailwind.config = {
				darkMode: 'class',
				theme: {
					extend: {
						colors: {
							brand: { 500: '#6c5ce7', 600: '#5b4bc4' },
							dark: {
								900: '#0f1216',
								800: '#161822',
								700: '#1e2030',
								600: '#2a313c',
							},
						},
					},
				},
			};
		</script>
	</head>
	<body
		class="bg-dark-900 text-slate-100 min-h-screen font-sans antialiased selection:bg-brand-500 selection:text-white"
	>
		<!-- Navigation -->
		<nav
			class="sticky top-0 z-50 bg-dark-800/80 backdrop-blur-md border-b border-dark-600 px-6 sm:px-8 h-16 flex items-center justify-between"
		>
			<a
				class="flex items-center gap-3 text-lg font-bold tracking-tight hover:opacity-90 transition"
				href="/"
			>
				<span class="relative flex h-3 w-3">
					<span
						class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"
					></span>
					<span
						class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"
					></span>
				</span>
				<span class="text-slate-100 tracking-tight">Smart Litter</span>
			</a>

			<div class="flex items-center gap-4 sm:gap-6">
				<span
					class="text-xs font-semibold px-3 py-1 rounded-full bg-dark-700 text-slate-400 border border-dark-600"
					id="eventCount"
					>0 event(s)</span
				>
				<div class="flex items-center gap-1 sm:gap-2">
					<a
						href="/"
						class="text-sm font-medium px-3.5 py-1.5 rounded-lg bg-brand-500/10 text-brand-500 border border-brand-500/20 transition"
						>Dashboard</a
					>
					<a
						href="/process"
						class="text-sm font-medium px-3.5 py-1.5 rounded-lg text-slate-400 hover:text-slate-100 hover:bg-dark-700 transition"
						>Live Detection</a
					>
					<a
						href="/roster"
						class="text-sm font-medium px-3.5 py-1.5 rounded-lg text-slate-400 hover:text-slate-100 hover:bg-dark-700 transition"
						>People</a
					>
					<a
						href="#"
						id="logoutLink"
						class="text-sm font-medium px-3.5 py-1.5 rounded-lg text-rose-400 hover:bg-rose-500/10 transition"
						>Logout</a
					>
				</div>
			</div>
		</nav>

		<!-- Main Content -->
		<main class="max-w-7xl mx-auto px-6 sm:px-8 py-8">
			<div
				class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"
				id="loading-grid"
			>
				<div
					class="animate-pulse bg-dark-800 border border-dark-600 rounded-xl aspect-video"
				></div>
				<div
					class="animate-pulse bg-dark-800 border border-dark-600 rounded-xl aspect-video hidden sm:block"
				></div>
				<div
					class="animate-pulse bg-dark-800 border border-dark-600 rounded-xl aspect-video hidden lg:block"
				></div>
			</div>

			<div
				class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"
				id="events-grid"
			></div>

			<div
				class="hidden flex-col items-center justify-center py-20 text-center"
				id="empty-msg"
			>
				<div
					class="w-16 h-16 mb-4 rounded-full bg-dark-800 flex items-center justify-center text-slate-500 border border-dark-600"
				>
					📌
				</div>
				<h3 class="text-lg font-semibold text-slate-300">No events found</h3>
				<p class="text-sm text-slate-500 mt-1">
					No litter events recorded yet.
				</p>
			</div>
		</main>

		<script src="/static/auth.js"></script>
		<script>
			(function () {
				if (!Auth.requireAuth()) return;

				document
					.getElementById('logoutLink')
					.addEventListener('click', function (ev) {
						ev.preventDefault();
						Auth.clearTokens();
						window.location.href = '/login';
					});

				const authFetch = Auth.authFetch;

				let eventCount = 0;
				const countEl = document.getElementById('eventCount');
				const grid = document.getElementById('events-grid');
				const emptyMsg = document.getElementById('empty-msg');
				const loadingGrid = document.getElementById('loading-grid');

				function createCard(e) {
					const d = document.createElement('div');
					d.className =
						'group bg-dark-800 border border-dark-600 rounded-xl overflow-hidden shadow-lg hover:border-brand-500/50 hover:shadow-brand-500/10 transition-all duration-300 flex flex-col';
					const personBadge = e.person_name
						? '<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-brand-500/10 text-brand-400 border border-brand-500/20">👤 ' +
						  e.person_name +
						  (e.face_similarity != null
								? ' · ' + Math.round(e.face_similarity * 100) + '%'
								: '') +
						  '</span>'
						: '';
					d.innerHTML =
						'<div class="relative aspect-video bg-black overflow-hidden">' +
						'<video class="w-full h-full object-cover" controls preload="metadata" poster="' +
						e.preview_url +
						'">' +
						'<source src="' +
						e.video_url +
						'" type="video/mp4" />' +
						'</video>' +
						'<button type="button" data-delete class="absolute top-2 right-2 w-7 h-7 flex items-center justify-center rounded-lg bg-black/60 text-slate-300 opacity-0 group-hover:opacity-100 hover:bg-rose-500/80 hover:text-white transition-all" title="Delete event" aria-label="Delete event">' +
						'<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>' +
						'</button>' +
						'</div>' +
						'<div class="p-4 flex flex-col gap-3 flex-1 justify-between">' +
						'<div class="flex items-center justify-between gap-2 flex-wrap">' +
						'<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 capitalize">' +
						e.object_type +
						'</span>' +
						personBadge +
						'<span class="text-xs font-mono font-medium text-slate-400 bg-dark-700 px-2 py-0.5 rounded ml-auto">' +
						Math.round(e.confidence * 100) +
						'% match</span>' +
						'</div>' +
						'<div class="space-y-1 text-xs text-slate-400">' +
						'<div class="flex items-center gap-1.5">📷 <span class="font-medium text-slate-300">' +
						e.camera_id +
						'</span></div>' +
						'<div class="flex items-center gap-1.5">🕒 <span>' +
						new Date(e.timestamp).toLocaleString() +
						'</span></div>' +
						'</div>' +
						'<a class="mt-2 w-full inline-flex justify-center items-center px-4 py-2 bg-brand-500 hover:bg-brand-600 text-white font-medium text-xs rounded-lg transition-colors shadow-sm" href="' +
						e.download_url +
						'">Download clip</a>' +
						'</div>';

					const deleteBtn = d.querySelector('[data-delete]');
					let confirmTimer = null;
					deleteBtn.addEventListener('click', function (ev) {
						ev.preventDefault();
						if (!deleteBtn.dataset.armed) {
							deleteBtn.dataset.armed = '1';
							deleteBtn.classList.add('bg-rose-500', 'text-white');
							deleteBtn.title = 'Click again to confirm delete';
							deleteBtn.setAttribute('aria-label', 'Click again to confirm delete');
							deleteBtn.innerHTML =
								'<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>';
							confirmTimer = setTimeout(function () {
								delete deleteBtn.dataset.armed;
								deleteBtn.classList.remove('bg-rose-500', 'text-white');
								deleteBtn.title = 'Delete event';
								deleteBtn.setAttribute('aria-label', 'Delete event');
								deleteBtn.innerHTML =
									'<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>';
							}, 3000);
							return;
						}
						clearTimeout(confirmTimer);
						authFetch('/events/' + e.id, { method: 'DELETE' })
							.then(function () {
								d.remove();
								eventCount = Math.max(0, eventCount - 1);
								countEl.textContent = eventCount + ' event(s)';
								if (eventCount === 0) {
									emptyMsg.classList.remove('hidden');
									emptyMsg.classList.add('flex');
								}
							})
							.catch(function (err) {
								console.error('Failed to delete event', err);
							});
					});

					return d;
				}

				function basename(path) {
					return path.split('/').pop();
				}

				function toView(e) {
					return {
						id: e.id,
						timestamp: e.timestamp,
						camera_id: e.camera_id,
						confidence: e.confidence,
						object_type: e.object_type,
						person_name: e.person_name,
						face_similarity: e.face_similarity,
						preview_url: '/media/' + basename(e.preview_image),
						video_url: '/media/' + basename(e.video_path),
						download_url: '/events/' + e.id + '/download',
					};
				}

				function render(events) {
					loadingGrid.remove();
					eventCount = events.length;
					countEl.textContent = eventCount + ' event(s)';
					grid.innerHTML = '';
					if (events.length === 0) {
						emptyMsg.classList.remove('hidden');
						emptyMsg.classList.add('flex');
						return;
					}
					emptyMsg.classList.add('hidden');
					emptyMsg.classList.remove('flex');
					events.forEach(function (e) {
						grid.appendChild(createCard(toView(e)));
					});
				}

				authFetch('/events')
					.then(function (r) {
						return r.json();
					})
					.then(render)
					.then(function () {
						// Opened after /events resolves: the access token is
						// guaranteed fresh by then (authFetch refreshes on
						// 401), and EventSource can't be reattached with a
						// new token mid-connection if it started stale.
						connectStream();
					})
					.catch(function (e) {
						console.error('Failed to load events', e);
						loadingGrid.innerHTML =
							'<div class="col-span-full text-center py-10 text-sm text-rose-400">Couldn\'t load events. Refresh to retry.</div>';
					});

				function connectStream() {
					const es = new EventSource(
						'/events/stream?token=' + encodeURIComponent(Auth.getAccess())
					);
					es.onmessage = handleStreamMessage;
				}

				function handleStreamMessage(ev) {
					const data = JSON.parse(ev.data);
					eventCount++;
					countEl.textContent = eventCount + ' event(s)';
					emptyMsg.classList.add('hidden');
					emptyMsg.classList.remove('flex');
					grid.prepend(createCard(data));
				}
			})();
		</script>
	</body>
</html>
